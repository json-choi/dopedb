[package]
name = "dopedb"
version = "0.3.97"
edition = "2021"
rust-version = "1.94"
description = "Cross-platform database client with a connection-pinned local CLI broker"
authors = ["Jaesong Choi"]
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dopedb"
path = "src/main.rs"

[features]
default = []
# Release-profile application used only by scripts/benchmark-packaged-release.mjs.
# Ordinary production artifacts never compile the isolated fixture/report paths.
packaged-benchmark = ["dep:objc2", "dep:objc2-app-kit"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dopedb-protocol = { path = "../dopedb-protocol" }
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "macros",
    # rust_decimal: lossless NUMERIC/DECIMAL decode (exact-string in the JSON grid).
    "rust_decimal",
    # PG-only decoders for otherwise-unsupported column types; all TLS-agnostic
    # (no native-tls), compatible with tls-rustls-ring.
    "ipnetwork",   # INET/CIDR  -> IpNetwork
    "mac_address", # MACADDR    -> MacAddress
    "bit-vec",     # BIT/VARBIT -> BitVec
] }
mongodb = "3.9"
sqlparser = "0.62"
sqlformat = "0.5.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
flate2 = "1.1.10"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
keyring = "4.2"
chacha20poly1305 = "0.11.0"
subtle = "2.6"
zeroize = "1.9"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
futures = "0.3"
rust_xlsxwriter = { version = "0.99.0", features = ["constant_memory"] }
calamine = "0.36.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio-util = "0.7.19"
dashmap = "6.2.1"
schemars = "1.2.2"
tempfile = "3"
x509-parser = "0.18"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
agent-client-protocol = "=2.0.0"
minisign-verify = "0.2.5"
semver = "1.0"
tar = "0.4"
ignore = "0.4"
notify = "8"
url = "2.5.8"
tree-sitter = "0.27.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
