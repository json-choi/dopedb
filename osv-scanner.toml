[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2026-11-30
reason = "block-buffer 0.10.4 can corrupt its cursor only when the compress callback panics and the panic is caught before the buffer is reused. Its only callers are digest 0.10 hashes (sha2, hmac, pbkdf2, scrypt via sqlx, minisign and Tauri), whose compress functions do not panic. The fix exists only in block-buffer 0.12.1, which the digest 0.10 ecosystem cannot use."

