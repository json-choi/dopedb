[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-11-30
reason = "KaTeX reaches the Desktop bundle only through mermaid, which renders with securityLevel strict and htmlLabels off. Mermaid 12.1.0 still requires katex ^0.16.47 while the fix exists only in 0.18.2, and the advisory needs an already polluted Object.prototype."

# zip < 9.0.0: all three advisories are in the extraction API (ZipArchive::extract
# and ZipStreamReader::extract). zip 8.6.0 remains only because calamine 0.36.1
# (reader) and rust_xlsxwriter 0.99.1 (writer) still require zip ^8. DopeDB reads
# entries itself through enclosed_name, rejects links, and never calls extract;
# the root clippy.toml rejects the extract APIs. The updater's zip feature, the
# only extracting caller, is disabled in src-tauri/Cargo.toml.
# Remove these ignores once both crates accept zip 9.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2026-11-30
reason = "SUID/SGID bits are applied only by zip's extract APIs. DopeDB, calamine, and rust_xlsxwriter never call them, and calamine/rust_xlsxwriter still pin zip ^8; the updater's zip feature that did extract is disabled."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2026-11-30
reason = "Symlink targets escape only through ZipArchive::extract. DopeDB rejects link entries and copies files itself; calamine and rust_xlsxwriter never call extract and still pin zip ^8."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2026-11-30
reason = "Permissions are applied through symlinks only by the zip extract APIs. DopeDB, calamine, and rust_xlsxwriter never call them, and calamine/rust_xlsxwriter still pin zip ^8."
