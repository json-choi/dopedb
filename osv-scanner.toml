id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-11-30
reason = "KaTeX reaches the Desktop bundle only through mermaid, which renders with securityLevel strict and htmlLabels off. Mermaid 12.1.0 still requires katex ^0.16.47 while the fix exists only in 0.18.2, and the advisory needs an already polluted Object.prototype."

# zip < 9 extraction advisories. Keep tauri-plugin-updater's zip feature off
# (src-tauri/Cargo.toml): these ignores are scoped by advisory ID, so they would
# also hide a reintroduced extracting caller on another zip version.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2026-11-17
reason = "zip 9.0 fixes extract() symlink and permission handling, but calamine 0.36.1 and rust_xlsxwriter 0.99.1 still require zip 8. DopeDB never calls extract(): XLSX validation only reads entries, and the Windows BigQuery SDK unpacker rejects symlinks and unsafe paths and writes new files without restoring mode bits. The updater's zip feature, the only extract() caller, is disabled, and clippy.toml rejects the extract APIs."

