[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-11-30
reason = "KaTeX reaches the Desktop bundle only through mermaid, which renders with securityLevel strict and htmlLabels off. Mermaid 12.1.0 still requires katex ^0.16.47 while the fix exists only in 0.18.2, and the advisory needs an already polluted Object.prototype."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2026-11-17
reason = "zip 9.0 fixes extract() symlink and permission handling, but calamine 0.36.1 and rust_xlsxwriter 0.99.1 still require zip 8 and tauri-plugin-updater 2.12.0 requires zip 4. DopeDB never calls extract(): XLSX validation only reads entries, and the Windows BigQuery SDK unpacker rejects symlinks and unsafe paths and writes new files without restoring mode bits. The only extract() caller is the Windows updater, after it verifies the release signature."

