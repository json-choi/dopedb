# zip's bulk extraction APIs trust archive-declared symlinks, sizes and modes and
# have repeatedly carried advisories (RUSTSEC-2026-0367..0369, -0429). DopeDB never
# calls them; read entries through `enclosed_name` and write files explicitly instead.
disallowed-methods = [
    { path = "zip::read::ZipArchive::extract", reason = "unsafe zip extraction; copy validated entries explicitly" },
    { path = "zip::read::ZipArchive::extract_unwrapped_root_dir", reason = "unsafe zip extraction; copy validated entries explicitly" },
    { path = "zip::unstable::stream::ZipStreamReader::extract", reason = "unsafe zip extraction; copy validated entries explicitly" },
]
