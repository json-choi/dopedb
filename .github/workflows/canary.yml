name: canary-build

on:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - reopened
      - synchronize

concurrency:
  group: canary-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'work/') &&
      contains(github.event.pull_request.labels.*.name, 'canary')
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            asset_name: DopeDB-canary-macos-arm64.dmg
            slug: macos-arm64
          - platform: macos-15
            target: x86_64-apple-darwin
            artifact_glob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            asset_name: DopeDB-canary-macos-x64.dmg
            slug: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            asset_name: DopeDB-canary-windows-x64-setup.exe
            slug: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Validate the pull request source
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SOURCE_REF: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected_prefix="work/${PR_AUTHOR}/"
          if [[ "$SOURCE_REF" != "$expected_prefix"* ]]; then
            echo "Canary branches must start with $expected_prefix" >&2
            exit 1
          fi
          git check-ref-format --branch "$SOURCE_REF" >/dev/null
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The pull request head must resolve to an immutable commit." >&2
            exit 1
          fi

      # Pull-request scope keeps untrusted build code away from the default
      # branch cache and from every publishing credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set isolated canary version
        shell: bash
        env:
          CANARY_ACTOR: ${{ github.event.pull_request.user.login }}
          CANARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const actorSlug = process.env.CANARY_ACTOR
            .toLowerCase()
            .replace(/[^a-z0-9-]/g, "-")
            .replace(/-+$/g, "");
          const runId = process.env.CANARY_RUN_ID;
          const runAttempt = process.env.CANARY_RUN_ATTEMPT;
          if (!actorSlug || !/^\d+$/.test(runId) || !/^\d+$/.test(runAttempt)) {
            throw new Error("Invalid canary version context");
          }
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const baseVersion = String(packageJson.version).split("-", 1)[0];
          if (!/^\d+\.\d+\.\d+$/.test(baseVersion)) {
            throw new Error("Invalid base version");
          }
          const version = `${baseVersion}-canary.${actorSlug}.${runId}.${runAttempt}`;
          for (const path of ["package.json", "src-tauri/tauri.conf.json"]) {
            const data = JSON.parse(readFileSync(path, "utf8"));
            data.version = version;
            writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = readFileSync(cargoPath, "utf8");
          writeFileSync(cargoPath, cargo.replace(/^version = "[^"]+"/m, `version = "${version}"`));
          NODE

      - name: Build unsigned canary bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          config_override='{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --ci --no-sign --target "$TARGET" --config "$config_override"

      - name: Collect canary installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${{ matrix.artifact_glob }} )
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected one installer, found ${#files[@]}." >&2
            exit 1
          fi

          mkdir -p canary-dist
          cp -- "${files[0]}" "canary-dist/${{ matrix.asset_name }}"

      - name: Upload untrusted canary installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-${{ matrix.slug }}
          path: canary-dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 14
