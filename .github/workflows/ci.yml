name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency_vulnerability_scan:
    name: dependency-vulnerability-scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read
      contents: read
      security-events: write

  frontend_smoke:
    name: frontend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm build

      - name: Test critical frontend paths
        run: pnpm test

  rust_smoke:
    name: rust-smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Stage CLI sidecar
        run: bash scripts/build-sidecars.sh

      - name: Test critical Rust paths
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --package dopedb --lib
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e
          cargo test --package release-updater-verify

  provider_postgres:
    name: provider-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workspace-cloud/pnpm-lock.yaml

      - name: Install workspace cloud dependencies
        run: pnpm --dir workspace-cloud install --frozen-lockfile

      - name: Build workspace cloud without production secrets
        run: pnpm --dir workspace-cloud build

      - name: Test Workspace public contracts
        run: pnpm --dir workspace-cloud test:contracts

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Test Provider import harness guard
        run: pnpm --dir workspace-cloud test:postgres-harness-guard

      - name: Test Provider import concurrency
        env:
          PROVIDER_IMPORT_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/test-provider-import-postgres.sh

  site_build:
    name: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Build marketing site
        run: pnpm --dir site build

  analytics_cloudflare:
    name: analytics-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: product-analytics-cloudflare/pnpm-lock.yaml

      - name: Install analytics Worker dependencies
        run: pnpm --dir product-analytics-cloudflare install --frozen-lockfile

      - name: Verify analytics Worker and public contract
        run: |
          pnpm --dir product-analytics-cloudflare build
          pnpm --dir product-analytics-cloudflare test
          pnpm --dir product-analytics-cloudflare exec wrangler deploy --dry-run

  scheduler_cloudflare:
    name: scheduler-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workspace-scheduler-cloudflare/pnpm-lock.yaml

      - name: Install scheduler Worker dependencies
        run: pnpm --dir workspace-scheduler-cloudflare install --frozen-lockfile

      - name: Verify scheduler Worker
        run: |
          pnpm --dir workspace-scheduler-cloudflare build
          pnpm --dir workspace-scheduler-cloudflare test
          pnpm --dir workspace-scheduler-cloudflare exec wrangler deploy --dry-run

  build:
    needs:
      - dependency_vulnerability_scan
      - frontend_smoke
      - rust_smoke
      - provider_postgres
      - site_build
      - analytics_cloudflare
      - scheduler_cloudflare
      - windows-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the required build check
        env:
          DEPENDENCY_VULNERABILITY_SCAN_RESULT: ${{ needs.dependency_vulnerability_scan.result }}
          FRONTEND_RESULT: ${{ needs.frontend_smoke.result }}
          RUST_RESULT: ${{ needs.rust_smoke.result }}
          PROVIDER_POSTGRES_RESULT: ${{ needs.provider_postgres.result }}
          SITE_BUILD_RESULT: ${{ needs.site_build.result }}
          ANALYTICS_CLOUDFLARE_RESULT: ${{ needs.analytics_cloudflare.result }}
          SCHEDULER_CLOUDFLARE_RESULT: ${{ needs.scheduler_cloudflare.result }}
          WINDOWS_CHECK_RESULT: ${{ needs.windows-check.result }}
        run: |
          test "$DEPENDENCY_VULNERABILITY_SCAN_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PROVIDER_POSTGRES_RESULT" = success
          test "$SITE_BUILD_RESULT" = success
          test "$ANALYTICS_CLOUDFLARE_RESULT" = success
          test "$SCHEDULER_CLOUDFLARE_RESULT" = success
          test "$WINDOWS_CHECK_RESULT" = success

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows architecture portability
        run: pnpm check:architecture

      - name: Verify Windows UI palette paths
        run: node scripts/check-ui-palette.mjs

      - name: Verify Windows issue-review credential isolation
        run: node scripts/issue-review/local-issue-review.mjs --self-test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: false

      - name: Stage Windows test sidecars
        shell: pwsh
        run: |
          cargo build --package dopedb-cli --bins
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/debug/dopedb-cli.exe src-tauri/binaries/dopedb-cli-x86_64-pc-windows-msvc.exe
          Copy-Item target/debug/dopedb-agent-bridge.exe src-tauri/binaries/dopedb-agent-bridge-x86_64-pc-windows-msvc.exe
          Copy-Item target/debug/dopedb-cli.exe src-tauri/binaries/cloud-sql-proxy-x86_64-pc-windows-msvc.exe

      - name: Test Windows ACP, Broker, and Provider boundaries
        run: |
          cargo test --package dopedb --lib broker::session::tests
          cargo test --package dopedb --lib query_and_skill_security_contracts_stay_fail_closed
          cargo test --package dopedb --lib features::providers::adapters::authority::tests
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e
