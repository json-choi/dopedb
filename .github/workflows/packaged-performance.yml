name: Manual packaged performance
run-name: Manual packaged performance · ${{ inputs.scenario }} · startup=${{ inputs.startup_samples }} · workload=${{ inputs.workload_samples }}

# Deliberately manual-only. Do not add push, pull_request, schedule, release,
# or workflow_call triggers: this benchmark is long-running diagnostic work,
# not a required CI or release check.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "All journeys or one diagnostic scenario"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - startup
          - sql-editor
          - explorer-search
          - query-result
          - table-first-row
          - agent-transcript
          - agent-tools
          - long-lived-data
          - interaction-surfaces
          - idle-runtime
      startup_samples:
        description: "Cold/warm samples per startup state"
        required: true
        default: "5"
        type: string
      workload_samples:
        description: "Samples per workload scenario"
        required: true
        default: "3"
        type: string

concurrency:
  group: packaged-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            slug: macos-arm64
          - platform: windows-latest
            slug: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # A budget regression is a useful diagnostic result, not a failed
          # compilation. Preserve the completed release build so the next
          # manually requested scenario does not pay the full Windows build.
          cache-on-failure: true
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure packaged release journeys
        shell: bash
        env:
          STARTUP_SAMPLES: ${{ inputs.startup_samples }}
          WORKLOAD_SAMPLES: ${{ inputs.workload_samples }}
          SCENARIO: ${{ inputs.scenario }}
          OUTPUT: src-tauri/benchmarks/packaged-release-${{ matrix.slug }}.json
        run: |
          args=(
            --samples "$STARTUP_SAMPLES"
            --workload-samples "$WORKLOAD_SAMPLES"
            --output "$OUTPUT"
          )
          if [[ "$SCENARIO" != "all" ]]; then
            args+=(--only "$SCENARIO")
          fi
          pnpm benchmark:packaged-release -- "${args[@]}"

      - name: Upload numeric performance artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-performance-${{ matrix.slug }}
          path: src-tauri/benchmarks/packaged-release-${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 30
