name: ACP adapter pin updates

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: acp-adapter-pin-update
  cancel-in-progress: false

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent-runtime/plugins/package-lock.json

      - name: Update exact upstream package, tag, commit, and lock pins
        run: |
          set -euo pipefail
          node scripts/agent-runtime/update-acp-plugin-pins.mjs
          npm install \
            --prefix agent-runtime/plugins \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          node scripts/agent-runtime/build-acp-plugin.mjs --check-config

      - name: Prepare a reviewable patch when pins changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ACP adapter pins already match the latest verified upstream releases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --binary > "$RUNNER_TEMP/acp-adapter-pins.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## ACP adapter pin update available"
            echo
            echo "Download the patch artifact, review it, and apply it through the repository's owner-approved direct-main flow."
            echo
            echo '```text'
            git diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the review patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acp-adapter-pins-${{ github.run_id }}
          path: ${{ runner.temp }}/acp-adapter-pins.patch
          if-no-files-found: error
          retention-days: 14
