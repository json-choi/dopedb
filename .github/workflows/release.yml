name: release

on:
  push:
    tags:
      - "app-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos_distribution_mode: ${{ steps.macos_distribution.outputs.mode }}
      release_body: ${{ steps.release_notes.outputs.body }}
    permissions:
      # Draft releases are invisible to this read-only token. The protected
      # publish job verifies the exact owner draft before install or build.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify owner, version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "json-choi" ]]; then
            echo "Only @json-choi may start a stable release." >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#app-v}"
          node scripts/release/verify-release-version.mjs "$tag_version"

          tag_object_type="$(git cat-file -t "$GITHUB_REF" 2>/dev/null || true)"
          if [[ "$tag_object_type" != "tag" ]]; then
            echo "Stable releases require an annotated app-vX.Y.Z tag." >&2
            exit 1
          fi

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Stable releases must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Verify publicly available ACP compatibility
        run: node scripts/agent-runtime/verify-published-acp.mjs

      - name: Resolve macOS distribution mode
        id: macos_distribution
        shell: bash
        run: |
          set -euo pipefail

          mode="$(node -p "JSON.parse(require('node:fs').readFileSync('.release/macos-distribution.json', 'utf8')).distributionMode")"
          case "$mode" in
            legacy-unsigned|developer-id) ;;
            *)
              echo "Unsupported macOS distribution mode: $mode" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "macOS distribution mode: $mode"

      - name: Prepare release notes
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#app-v}"
          mode="$(node scripts/release/generate-release-notes.mjs mode)"
          notes_path="$RUNNER_TEMP/release-notes.md"
          args=(
            render
            --version "$version"
            --tag "$GITHUB_REF_NAME"
            --to "$GITHUB_SHA"
            --output "$notes_path"
          )

          if [[ "$mode" == "active" ]]; then
            previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            args+=(--from "$previous_tag")
          fi

          node scripts/release/generate-release-notes.mjs "${args[@]}"

          delimiter="RELEASE_NOTES_${GITHUB_SHA:0:12}"
          {
            echo "body<<$delimiter"
            cat "$notes_path"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: verify-release
    permissions:
      contents: write
    timeout-minutes: 60
    environment:
      name: stable-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target aarch64-apple-darwin
            mac_asset_suffix: aarch64
            sentry_sourcemaps: "1"
          - platform: macos-15
            target: x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            mac_asset_suffix: x64
            sentry_sourcemaps: "0"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
            mac_asset_suffix: ""
            sentry_sourcemaps: "0"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify owner-created draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag_object_type="$(git cat-file -t "$GITHUB_REF" 2>/dev/null || true)"
          if [[ "$tag_object_type" != "tag" ]]; then
            echo "Stable builds require an annotated app-vX.Y.Z tag." >&2
            exit 1
          fi

          if ! release_state="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,author \
            --jq '[.tagName, .isDraft, .isPrerelease, .author.login] | @tsv' 2>/dev/null)"; then
            echo "Stable builds require an owner-created draft release before environment approval." >&2
            echo "Run: pnpm release:stable:draft -- ${GITHUB_REF_NAME#app-v}" >&2
            exit 1
          fi

          expected_state="${GITHUB_REF_NAME}"$'\ttrue\tfalse\tjson-choi'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "Stable release must be the matching non-prerelease draft: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # 태그 ref에서 저장한 캐시는 다음 태그가 읽을 수 없으므로 release-cache
          # 워크플로우가 main에 적립한 같은 shared-key 캐시만 읽는다. shared-key가
          # 없으면 두 macOS target이 job 이름 기반 키를 공유해 서로 덮어쓴다.
          shared-key: release-${{ matrix.target }}
          save-if: false
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID identity and configure notarization
        if: runner.os == 'macOS' && needs.verify-release.outputs.macos_distribution_mode == 'developer-id'
        shell: bash
        env:
          DOPEDB_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          DOPEDB_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          DOPEDB_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DOPEDB_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          DOPEDB_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for variable in \
            DOPEDB_APPLE_CERTIFICATE \
            DOPEDB_APPLE_CERTIFICATE_PASSWORD \
            DOPEDB_APPLE_API_ISSUER \
            DOPEDB_APPLE_API_KEY \
            DOPEDB_APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Protected stable-release secret is missing: $variable" >&2
              exit 1
            fi
          done

          team_id="$(node -p "JSON.parse(require('fs').readFileSync('.release/macos-distribution.json', 'utf8')).teamIdentifier")"
          if [[ ! "$team_id" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Checked-in Apple TeamIdentifier is invalid." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/dopedb-developer-id.keychain-db"
          certificate="$RUNNER_TEMP/dopedb-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${DOPEDB_APPLE_API_KEY}.p8"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          {
            echo "DOPEDB_SIGNING_KEYCHAIN=$keychain"
            echo "DOPEDB_SIGNING_CERTIFICATE=$certificate"
            echo "DOPEDB_SIGNING_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

          printf '%s' "$DOPEDB_APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          printf '%s' "$DOPEDB_APPLE_API_PRIVATE_KEY" > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$DOPEDB_APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          identities="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application:.*)".*/\1/p')"
          identity_count="$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$identity_count" != "1" || "$identities" != *"($team_id)"* ]]; then
            echo "Exactly one Developer ID Application identity for the expected team is required." >&2
            exit 1
          fi

          {
            echo "APPLE_SIGNING_IDENTITY=$identities"
            echo "APPLE_API_ISSUER=$DOPEDB_APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$DOPEDB_APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$api_key"
          } >> "$GITHUB_ENV"

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOPEDB_SENTRY_UPLOAD_SOURCE_MAPS: ${{ matrix.sentry_sourcemaps }}
          SENTRY_AUTH_TOKEN: ${{ matrix.sentry_sourcemaps == '1' && secrets.SENTRY_AUTH_TOKEN || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: dopedb v__VERSION__
          releaseBody: ${{ needs.verify-release.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      - name: Notarize and staple macOS DMG
        id: notarize_macos_dmg
        if: runner.os == 'macOS' && needs.verify-release.outputs.macos_distribution_mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/notarize-macos-dmg.sh \
            --bundle-root "target/${{ matrix.target }}/release/bundle" \
            --github-output "$GITHUB_OUTPUT"

      - name: Replace draft DMG with notarized artifact
        if: runner.os == 'macOS' && needs.verify-release.outputs.macos_distribution_mode == 'developer-id'
        shell: bash
        env:
          DOPEDB_NOTARIZED_DMG: ${{ steps.notarize_macos_dmg.outputs.dmg }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPEDB_NOTARIZED_DMG" || ! -f "$DOPEDB_NOTARIZED_DMG" ]]; then
            echo "Notarized DMG output is missing." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$DOPEDB_NOTARIZED_DMG" \
            --clobber

      - name: Verify Developer ID, notarization, and identical app payloads
        if: runner.os == 'macOS' && needs.verify-release.outputs.macos_distribution_mode == 'developer-id'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#app-v}"
          mkdir -p release-trust
          receipt="release-trust/DopeDB_${version}_${{ matrix.mac_asset_suffix }}.macos-trust.json"
          node scripts/release/capture-macos-distribution-trust.mjs \
            --bundle-root "target/${{ matrix.target }}/release/bundle" \
            --commit "$GITHUB_SHA" \
            --config .release/macos-distribution.json \
            --output "$receipt" \
            --tag "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$receipt" \
            --clobber

      - name: Remove temporary Apple signing material
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOPEDB_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DOPEDB_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${DOPEDB_SIGNING_CERTIFICATE:-$RUNNER_TEMP/missing-certificate}" \
            "${DOPEDB_SIGNING_API_KEY:-$RUNNER_TEMP/missing-api-key}"

  finalize-release:
    needs: [verify-release, publish-tauri]
    runs-on: ubuntu-latest
    # Full updater archives are downloaded twice (draft and anonymous public
    # paths). Developer ID assets join that closure only after explicit activation.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Upload stable direct-download aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#app-v}"
          mkdir -p release-alias/source

          download_asset() {
            local source_name="$1"
            local destination="release-alias/source/$source_name"

            for attempt in 1 2 3 4 5 6; do
              rm -f "$destination"
              if gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$source_name" \
                --dir release-alias/source && [[ -f "$destination" ]]; then
                return 0
              fi

              if [[ "$attempt" -eq 6 ]]; then
                echo "Release asset did not become available: $source_name" >&2
                return 1
              fi
              sleep $((attempt * 2))
            done
          }

          download_asset "DopeDB_${version}_aarch64.dmg"
          download_asset "DopeDB_${version}_x64.dmg"
          download_asset "DopeDB_${version}_x64-setup.exe"

          cp "release-alias/source/DopeDB_${version}_aarch64.dmg" \
            release-alias/DopeDB-macos-arm64.dmg
          cp "release-alias/source/DopeDB_${version}_x64.dmg" \
            release-alias/DopeDB-macos-x64.dmg
          cp "release-alias/source/DopeDB_${version}_x64-setup.exe" \
            release-alias/DopeDB-windows-x64-setup.exe

          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            release-alias/DopeDB-macos-arm64.dmg \
            release-alias/DopeDB-macos-x64.dmg \
            release-alias/DopeDB-windows-x64-setup.exe \
            --clobber

      - name: Install isolated Rust updater verifier
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Finalize public updater URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p release-finalize

          download_release_snapshot() {
            local manifest="release-finalize/latest.json"
            local assets="release-finalize/assets.json"
            local assets_candidate="${assets}.candidate"

            for attempt in 1 2 3 4 5 6; do
              rm -f "$manifest" "$assets" "$assets_candidate"
              if gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets > "$assets_candidate" && \
                gh release download "$GITHUB_REF_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern latest.json \
                  --dir release-finalize && \
                [[ -s "$manifest" ]] && [[ -s "$assets_candidate" ]]; then
                mv "$assets_candidate" "$assets"
                return 0
              fi

              if [[ "$attempt" -eq 6 ]]; then
                rm -f "$manifest" "$assets" "$assets_candidate"
                echo "Draft release snapshot did not become available: $GITHUB_REF_NAME" >&2
                return 1
              fi
              sleep $((attempt * 2))
            done
          }

          download_release_snapshot

          node scripts/release/finalize-updater-json.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-finalize/latest.json \
            --clobber

          # Clobbering latest.json changes its asset size and digest. GitHub's
          # draft asset metadata can lag the upload, so retry only that exact
          # stale-metadata condition; every closure/schema failure stops now.
          node scripts/release/wait-for-finalized-latest.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

      - name: Verify complete draft updater closure
        env:
          DOPEDB_MACOS_DISTRIBUTION_MODE: ${{ needs.verify-release.outputs.macos_distribution_mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#app-v}"
          mkdir -p release-finalize/draft-assets
          assets=(
            "DopeDB_${version}_aarch64.app.tar.gz"
            "DopeDB_${version}_aarch64.app.tar.gz.sig"
            "DopeDB_${version}_x64.app.tar.gz"
            "DopeDB_${version}_x64.app.tar.gz.sig"
            "DopeDB_${version}_x64-setup.exe"
            "DopeDB_${version}_x64-setup.exe.sig"
          )
          if [[ "$DOPEDB_MACOS_DISTRIBUTION_MODE" == "developer-id" ]]; then
            assets+=(
              "DopeDB_${version}_aarch64.dmg"
              "DopeDB_${version}_aarch64.macos-trust.json"
              "DopeDB_${version}_x64.dmg"
              "DopeDB_${version}_x64.macos-trust.json"
            )
          fi
          for asset in "${assets[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir release-finalize/draft-assets
          done

          node scripts/release/finalize-updater-json.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --check

          cargo run --locked -p release-updater-verify -- \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --commit "$GITHUB_SHA" \
            --downloads release-finalize/draft-assets \
            --macos-distribution .release/macos-distribution.json \
            --repository "$GITHUB_REPOSITORY" \
            --root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME"

      # GitHub immutable published releases can change only title and notes,
      # so public verification cannot precede the sole publish PATCH. All
      # draft closure, digest, and independent Minisign gates above run first;
      # the draft leaves the previous latest intact until this one REST
      # operation atomically publishes and selects the new latest release.
      - name: Publish the verified immutable release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `id` is GitHub's GraphQL node ID (for example RE_kw...), whereas
          # the REST PATCH endpoint requires the numeric `databaseId`.
          release_id="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release databaseId is missing or invalid." >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f make_latest=true \
            --silent

      - name: Verify anonymous tag-specific public updater downloads
        env:
          DOPEDB_MACOS_DISTRIBUTION_MODE: ${{ needs.verify-release.outputs.macos_distribution_mode }}
        run: |
          set -euo pipefail

          node scripts/release/download-public-updater-assets.mjs \
            --latest-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/latest.json" \
            --assets release-finalize/assets.json \
            --output release-finalize/public-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

          version="${GITHUB_REF_NAME#app-v}"
          if [[ "$DOPEDB_MACOS_DISTRIBUTION_MODE" == "developer-id" ]]; then
            for asset in \
              "DopeDB_${version}_aarch64.dmg" \
              "DopeDB_${version}_aarch64.macos-trust.json" \
              "DopeDB_${version}_x64.dmg" \
              "DopeDB_${version}_x64.macos-trust.json"; do
              curl \
                --fail \
                --location \
                --retry 4 \
                --retry-all-errors \
                --silent \
                --show-error \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" \
                --output "release-finalize/public-assets/$asset"
            done
          fi

          cargo run --locked -p release-updater-verify -- \
            --manifest release-finalize/public-assets/latest.json \
            --assets release-finalize/assets.json \
            --commit "$GITHUB_SHA" \
            --downloads release-finalize/public-assets \
            --macos-distribution .release/macos-distribution.json \
            --repository "$GITHUB_REPOSITORY" \
            --root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME"
