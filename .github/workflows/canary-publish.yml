name: canary-publish

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful canary-build run ID"
        required: true
        type: string

concurrency:
  group: canary-publish-${{ github.actor }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      actor_slug: ${{ steps.release.outputs.actor_slug }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate the completed pull-request build
        id: release
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run canary publication from main." >&2
            exit 1
          fi
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_run_id must be a positive integer." >&2
            exit 1
          fi

          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          expected_workflow_id="$(gh api "repos/${REPOSITORY}/actions/workflows/canary.yml" --jq .id)"
          if [[ "$(jq -r .workflow_id <<<"$run_json")" != "$expected_workflow_id" \
            || "$(jq -r .path <<<"$run_json")" != ".github/workflows/canary.yml" \
            || "$(jq -r .event <<<"$run_json")" != "pull_request" \
            || "$(jq -r .status <<<"$run_json")" != "completed" \
            || "$(jq -r .conclusion <<<"$run_json")" != "success" \
            || "$(jq -r .head_repository.full_name <<<"$run_json")" != "$REPOSITORY" \
            || "$(jq -r '.pull_requests | length' <<<"$run_json")" != "1" ]]; then
            echo "The selected run is not a successful same-repository canary build." >&2
            exit 1
          fi

          pull_number="$(jq -r '.pull_requests[0].number' <<<"$run_json")"
          if [[ ! "$pull_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "The selected run has no valid pull request." >&2
            exit 1
          fi
          pull_json="$(gh api "repos/${REPOSITORY}/pulls/${pull_number}")"
          source_ref="$(jq -r .head.ref <<<"$pull_json")"
          source_sha="$(jq -r .head.sha <<<"$pull_json")"
          pull_author="$(jq -r .user.login <<<"$pull_json")"
          if [[ ! "$pull_author" =~ ^[A-Za-z0-9-]{1,39}$ \
            || "${pull_author,,}" != "${EXPECTED_ACTOR,,}" \
            || "$(jq -r .state <<<"$pull_json")" != "open" \
            || "$(jq -r .base.ref <<<"$pull_json")" != "main" \
            || "$(jq -r .base.repo.full_name <<<"$pull_json")" != "$REPOSITORY" \
            || "$(jq -r .head.repo.full_name <<<"$pull_json")" != "$REPOSITORY" \
            || "$(jq -r .head_branch <<<"$run_json")" != "$source_ref" \
            || "$(jq -r .head_sha <<<"$run_json")" != "$source_sha" \
            || ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The canary run is not the caller's current open pull-request head." >&2
            exit 1
          fi
          expected_prefix="work/${pull_author}/"
          if [[ "$source_ref" != "$expected_prefix"* ]]; then
            echo "Canary branches must start with $expected_prefix" >&2
            exit 1
          fi
          git check-ref-format --branch "$source_ref" >/dev/null

          actor_slug="$(printf '%s' "$pull_author" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')"
          actor_slug="${actor_slug%-}"
          base_version="$(node -p "require('./src-tauri/tauri.conf.json').version.split('-')[0]")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || -z "$actor_slug" ]]; then
            echo "Invalid trusted canary release metadata." >&2
            exit 1
          fi
          version="${base_version}-canary.${actor_slug}.${BUILD_RUN_ID}"
          tag="canary-${actor_slug}-${BUILD_RUN_ID}"

          {
            echo "actor_slug=$actor_slug"
            echo "build_run_id=$BUILD_RUN_ID"
            echo "source_ref=$source_ref"
            echo "source_sha=$source_sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    environment:
      name: canary-${{ needs.validate.outputs.actor_slug }}
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    steps:
      # These binaries remain untrusted and are never executed by this job.
      - name: Download canary installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.build_run_id }}
          pattern: canary-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Publish immutable unsigned canary prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/DopeDB-canary-macos-arm64.dmg
            release-assets/DopeDB-canary-macos-x64.dmg
            release-assets/DopeDB-canary-windows-x64-setup.exe
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || -L "$asset" ]]; then
              echo "Missing regular canary installer: $asset" >&2
              exit 1
            fi
          done
          if [[ "$(find release-assets -type f | wc -l | tr -d ' ')" != "3" ]]; then
            echo "The canary build must contain exactly three installer files." >&2
            exit 1
          fi

          notes="Canary build from \`${SOURCE_REF}\` at \`${SOURCE_SHA}\`.

          This prerelease is unsigned, was built in an unprivileged pull-request job, does not contain updater metadata, and never enters the stable update channel."

          gh release create "$TAG" "${assets[@]}" \
            --draft \
            --prerelease \
            --latest=false \
            --target "$SOURCE_SHA" \
            --title "DopeDB ${VERSION}" \
            --notes "$notes"
          gh release edit "$TAG" --draft=false --prerelease --latest=false
