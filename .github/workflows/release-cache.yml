name: release-cache

# Actions 캐시는 만들어진 ref에 묶인다. app-v* 태그에서 도는 release 워크플로우는
# 이전 태그가 저장한 캐시를 볼 수 없고 기본 브랜치 캐시만 fallback으로 읽으므로,
# release와 같은 shared-key로 main에서 release 프로필 의존성을 미리 컴파일해 둔다.
# Cargo.lock이나 이 워크플로우가 바뀔 때 돌린다. Rust 버전은 release와
# rust-toolchain.toml의 고정 버전을 함께 따르며 수동 워밍도 지원한다.
on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - .github/workflows/release-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    name: warm-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      # src-tauri/build.rs는 externalBin sidecar가 이미 staged되어 있어야 통과한다.
      # 릴리즈는 beforeBuildCommand가 같은 스크립트를 돌리므로 조건을 맞춘다.
      - name: Stage sidecar binaries
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/build-sidecars.sh

      - name: Compile release dependencies
        run: cargo build --release --locked --target ${{ matrix.target }} --workspace
