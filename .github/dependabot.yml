version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      desktop-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /workspace-cloud
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-cloud)
    groups:
      workspace-cloud-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-site)
    groups:
      site-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /product-analytics-cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-analytics)
    groups:
      analytics-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /workspace-scheduler-cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-scheduler)
    groups:
      scheduler-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /agent-runtime/plugins
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-agents)
    groups:
      agent-adapter-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps-rust)
    groups:
      rust-dependencies:
        patterns:
          - "*"
