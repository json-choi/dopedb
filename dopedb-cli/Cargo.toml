[package]
name = "dopedb-cli"
version = "0.4.3"
edition = "2021"
rust-version = "1.94"
description = "Local CLI client for the DopeDB Desktop runtime"
license = "MIT"
publish = false

[[bin]]
# Keep the build artifact distinct from the desktop GUI binary. The app copies this
# signed sidecar to the user-facing `dopedb` command when installing the global CLI.
name = "dopedb-cli"
path = "src/main.rs"

[[bin]]
# ACP uses an app-only bridge so the public CLI parser and release surface never
# sit on the Agent database hot path.
name = "dopedb-agent-bridge"
path = "src/agent_bridge_main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6.9"
dirs = "6"
dopedb-protocol = { path = "../dopedb-protocol" }
hex = "0.4"
serde = "1"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
